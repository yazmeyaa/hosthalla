<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1d2f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10253a"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22d3ee" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1020" cy="90" r="190" fill="#22d3ee" fill-opacity=".08" filter="url(#glow)"/>
  <circle cx="80" cy="590" r="170" fill="#0ea5e9" fill-opacity=".07" filter="url(#glow)"/>

  <rect x="72" y="68" width="1056" height="494" rx="34" fill="url(#panel)" stroke="#214057" stroke-width="2"/>
  <path d="M73 460 370 163h758" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="3"/>

  <g transform="translate(128 150) scale(2.75)">
