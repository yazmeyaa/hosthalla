  </g>

  <text x="356" y="213" fill="#f8fafc" font-family="Adwaita Sans, DejaVu Sans, sans-serif" font-size="74" font-weight="700">Hosthalla</text>
  <text x="360" y="270" fill="#a5f3fc" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="28" font-weight="600">Infrastructure dashboard</text>
  <text x="128" y="390" fill="#cbd5e1" font-family="Adwaita Sans, DejaVu Sans, sans-serif" font-size="31">Track servers · Store access methods · Monitor live metrics</text>

